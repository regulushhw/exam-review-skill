<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{COURSE_TITLE}}</title>
<script>
window.MathJax = {
  svg: { scale: 1.05 },
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
body {
  margin: 0 auto;
  max-width: 48rem;
  padding: 1.5rem;
  color: #1a1a1a;
  background: #fff;
  font-family: "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  line-height: 2.2;
}
h1, h2, h3 {
  line-height: 1.4;
}
mjx-container {
  font-size: 105%;
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  border: 1px solid #ccc;
  padding: 0.4rem 0.6rem;
  vertical-align: top;
  text-align: left;
}
.codebox {
  margin: 0;
  padding: 0.6rem 0.8rem;
  background: #f6f6f6;
  font-family: Consolas, "Cascadia Code", "Source Code Pro", monospace;
  line-height: 2.2;
  white-space: pre-wrap;
}
.trap {
  margin: 1rem 0;
  padding: 0.6rem 1rem;
  border-left: 4px solid #9a3412;
  background: #fff7ed;
}
.trap-label {
  margin: 0;
  font-weight: 700;
}
.meta {
  margin-top: 0;
  color: #444;
}
.chapter {
  margin-top: 2rem;
}
.chapter-controls button,
.answer-btn-wrap button {
  margin: 0 0.4rem 0.4rem 0;
  font: inherit;
}
.answer {
  display: none;
}
@media print {
  body {
    max-width: none;
    padding: 0;
    line-height: 2.2;
  }
  .chapter-controls,
  .answer-btn-wrap {
    display: none;
  }
  .codebox,
  .trap,
  .question,
  .past-paper {
    break-inside: avoid;
  }
}
@page {
  margin: 16mm;
}
</style>
</head>
<body>
<header>
<h1>{{COURSE_TITLE}}</h1>
{{EXAM_LINE}}
</header>
<main id="chapters">
{{CHAPTERS}}
</main>
</body>
</html>
